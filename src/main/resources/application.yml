spring:
  application:
    name: seeland-mobil
  cache:
    type: simple
    cache-names: standortNutzung
  web:
    # Validierungsmeldungen auf Deutsch, unabhängig vom Browser
    locale: de_CH
    locale-resolver: fixed
  datasource:
    url: jdbc:postgresql://localhost:5432/seeland
    username: seeland
    password: seeland
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
springdoc:
  # Swagger UI unter http://localhost:8080/swagger-ui.html, Beschreibung unter /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  paths-to-match: /api/**
