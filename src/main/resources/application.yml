spring:
  application:
    name: seeland-mobil
  cache:
    type: simple
    cache-names: standortNutzung
  web:
    # Validierungsmeldungen auf Deutsch, unabhängig vom Browser
    locale: de_CH
    locale-resolver: fixed
  datasource:
    url: jdbc:postgresql://localhost:5432/seeland
    username: seeland
    password: seeland
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
